# Alert pack for the Krediwall gateway. Wire into Prometheus via
# rule_files (docker-compose does this already).
groups:
  - name: krediwall
    rules:
      - alert: KrediwallDown
        expr: up{job="krediwall"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Krediwall gateway is unreachable
          description: "The scrape target has been down for over a minute — payment checks are failing per your switch's timeout policy."

      - alert: KrediwallNoTraffic
        expr: rate(krediwall_evaluations_total[15m]) == 0 and up{job="krediwall"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Krediwall is up but receiving no evaluations
          description: "The switch may have stopped routing to it, or the pipeline is idle. If traffic is expected, investigate routing."

      - alert: KrediwallRuleError
        expr: increase(krediwall_rule_error_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: A rule is throwing — verdicts are degraded
          description: "{{ $labels.rule }} threw inside evaluate(). Its verdict contribution is being skipped; every verdict produced meanwhile is flagged degraded:true."

      - alert: KrediwallHookError
        expr: increase(krediwall_hook_errors_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Audit hook is dropping decision records
          description: "The onEvaluation audit hook threw — those decisions were not delivered to the audit sink and are lost. Check the hook's queue/writer."

      - alert: KrediwallLatencyBudget
        expr: histogram_quantile(0.99, sum by (le) (rate(krediwall_eval_latency_micros_bucket[5m]))) > 5000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: p99 evaluation latency above the 5ms budget
          description: "Sustained p99 above 5000µs — check machine load, GC pauses (see the bench notes), and whether rule count grew."

      - alert: KrediwallLineEviction
        expr: increase(krediwall_rule_stat_evictedLines[1h]) > 100000
        labels:
          severity: warning
        annotations:
          summary: Rule evicting credit lines — maxTrackedLines too small
          description: "{{ $labels.rule }} evicted over 100k lines in the last hour. Evicted lines lose their history; raise maxTrackedLines in the ruleset config (state costs ~1.4KB per line)."

      - alert: KrediwallHighBlockRate
        expr: |
          sum(rate(krediwall_verdict_total{verdict="BLOCK"}[10m]))
            / clamp_min(sum(rate(krediwall_evaluations_total[10m])), 0.001) > 0.10
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: BLOCK rate above 10% for half an hour
          description: "Usually thresholds set too tight for this lender's traffic — replay a labelled stream (npm run replay) and recalibrate rather than trusting the blocks."
