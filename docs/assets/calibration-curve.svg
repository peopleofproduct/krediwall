oke-width="2.5" marker-end="url(#aN)"/><rect x="940" y="400" width="580" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><circle cx="980" cy="475.0" r="20" fill="#0EA5A4"/><text x="980" y="482.0" font-size="20" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="980" dy="0">2</tspan></text><text x="1020" y="454.0" font-size="21" fill="#0A2540" font-weight="600" xml:space="preserve">Replay through <tspan font-family="'SFMono-Regular', Menlo, Consolas, monospace" fill="#0B7A79" font-size="20">tools/replay.mjs</tspan></text><text x="1020" y="482.0" font-size="19" fill="#475569" font-weight="400" text-anchor="start" ><tspan x="1020" dy="0">catch rate, FP rate, per-rule</tspan></text><text x="1020" y="510.0" font-size="19" fill="#475569" font-weight="400" text-anchor="start" ><tspan x="1020" dy="0">contributions, latency percentiles</tspan></text><path d="M980,556 L980,592" stroke="#0A2540" stroke-width="2.5" marker-end="url(#aN)"/><rect x="940" y="600" width="580" height="120" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><circle cx="980" cy="660.0" r="20" fill="#0EA5A4"/><text x="980" y="667.0" font-size="20" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="980" dy="0">3</tspan></text><text x="1020" y="653.0" font-size="21" fill="#0A2540" font-weight="600" text-anchor="start" ><tspan x="1020" dy="0">Sweep thresholds, pick the</tspan></text><text x="1020" y="681.0" font-size="21" fill="#0A2540" font-weight="600" text-anchor="start" ><tspan x="1020" dy="0">operating point, re-verify</tspan></text><text x="80" y="780" font-size="18" fill="#475569" font-weight="400" text-anchor="start" ><tspan x="80" dy="0">Curves are illustrative — Krediwall ships no labelled dataset; your numbers come from replaying your own traffic.</tspan></text>
