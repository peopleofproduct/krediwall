<rect width="1600" height="660" fill="#FFFFFF"/>
<text x="80" y="72" font-size="34" fill="#0A2540" font-weight="700" text-anchor="start" ><tspan x="80" dy="0">From npm install to first verdict — one afternoon</tspan></text><line x1="120" y1="330" x2="1480.0" y2="330" stroke="#0EA5A4" stroke-width="6" stroke-linecap="round"/><line x1="170.0" y1="304" x2="170.0" y2="260" stroke="#E2E8F0" stroke-width="2"/><text x="170.0" y="190" font-size="21" text-anchor="middle" fill="#0A2540" font-weight="600" xml:space="preserve"><tspan font-family="'SFMono-Regular', Menlo, Consolas, monospace" fill="#0B7A79" font-size="20">npm install</tspan></text><text x="170.0" y="218" font-size="21" text-anchor="middle" fill="#0A2540" font-weight="600" xml:space="preserve"><tspan font-family="'SFMono-Regular', Menlo, Consolas, monospace" fill="#0B7A79" font-size="20">@krediwall/*</tspan></text><text x="170.0" y="246" font-size="18" fill="#475569" font-weight="400" text-anchor="middle" ><tspan x="170.0" dy="0">zero dependencies</tspan></text><circle cx="170.0" cy="330" r="24" fill="#0EA5A4" stroke="#FFFFFF" stroke-width="4"/><text x="170.0" y="338" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="170.0" dy="0">1</tspan></text><line x1="327.5" y1="356" x2="327.5" y2="400" stroke="#E2E8F0" stroke-width="2"/><text x="327.5" y="430" font-size="21" text-anchor="middle" fill="#0A2540" font-weight="600" xml:space="preserve"><tspan font-family="'SFMono-Regular', Menlo, Consolas, monospace" fill="#0B7A79" font-size="20">npm run demo</tspan></text><text x="327.5" y="458" font-size="18" fill="#475569" font-weight="400" text-anchor="middle" ><tspan x="327.5" dy="0">see it think</tspan></text><circle cx="327.5" cy="330" r="24" fill="#0EA5A4" stroke="#FFFFFF" stroke-width="4"/><text x="327.5" y="338" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="327.5" dy="0">2</tspan></text><line x1="485.0" y1="304" x2="485.0" y2="260" stroke="#E2E8F0" stroke-width="2"/><text x="485.0" y="218" font-size="21" text-anchor="middle" fill="#0A2540" font-weight="600" xml:space="preserve"><tspan>run the gateway</tspan></text><text x="485.0" y="246" font-size="18" fill="#475569" font-weight="400" text-anchor="middle" ><tspan x="485.0" dy="0">one command</tspan></text><circle cx="485.0" cy="330" r="24" fill="#0EA5A4" stroke="#FFFFFF" stroke-width="4"/><text x="485.0" y="338" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="485.0" dy="0">3</tspan></text><line x1="642.5" y1="356" x2="642.5" y2="400" stroke="#E2E8F0" stroke-width="2"/><text x="642.5" y="430" font-size="21" text-anchor="middle" fill="#0A2540" font-weight="600" xml:space="preserve"><tspan>first API verdict</tspan></text><text x="642.5" y="458" font-size="21" text-anchor="middle" fill="#0A2540" font-weight="600" xml:space="preserve"><tspan>+ evidence JSON</tspan></text><circle cx="642.5" cy="330" r="24" fill="#0EA5A4" stroke="#FFFFFF" stroke-width="4"/><text x="642.5" y="338" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="642.5" dy="0">4</tspan></text><line x1="800.0" y1="304" x2="800.0" y2="260" stroke="#E2E8F0" stroke-width="2"/><text x="800.0" y="218" font-size="21" text-anchor="middle" fill="#0A2540" font-weight="600" xml:space="preserve"><tspan>set </tspan><tspan font-family="'SFMono-Regular', Menlo, Consolas, monospace" fill="#0B7A79" font-size="20">KREDIWALL_API_KEY</tspan></text><text x="800.0" y="246" font-size="18" fill="#475569" font-weight="400" text-anchor="middle" ><tspan x="800.0" dy="0">lock the door</tspan></text><circle cx="800.0" cy="330" r="24" fill="#0EA5A4" stroke="#FFFFFF" stroke-width="4"/><text x="800.0" y="338" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="800.0" dy="0">5</tspan></text><line x1="957.5" y1="356" x2="957.5" y2="400" stroke="#E2E8F0" stroke-width="2"/><text x="957.5" y="430" font-size="21" text-anchor="middle" fill="#0A2540" font-weight="600" xml:space="preserve"><tspan>plug in the FRI feed</tspan></text><text x="957.5" y="458" font-size="18" fill="#475569" font-weight="400" text-anchor="middle" ><tspan x="957.5" dy="0">translator included</tspan></text><circle cx="957.5" cy="330" r="24" fill="#0EA5A4" stroke="#FFFFFF" stroke-width="4"/><text x="957.5" y="338" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="957.5" dy="0">6</tspan></text><line x1="1115.0" y1="304" x2="1115.0" y2="260" stroke="#E2E8F0" stroke-width="2"/><text x="1115.0" y="218" font-size="21" text-anchor="middle" fill="#0A2540" font-weight="600" xml:space="preserve"><tspan font-family="'SFMono-Regular', Menlo, Consolas, monospace" fill="#0B7A79" font-size="20">docker compose up</tspan></text><text x="1115.0" y="246" font-size="18" fill="#475569" font-weight="400" text-anchor="middle" ><tspan x="1115.0" dy="0">dashboard auto-loads</tspan></text><circle cx="1115.0" cy="330" r="24" fill="#0EA5A4" stroke="#FFFFFF" stroke-width="4"/><text x="1115.0" y="338" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="1115.0" dy="0">7</tspan></text><line x1="1272.5" y1="356" x2="1272.5" y2="400" stroke="#E2E8F0" stroke-width="2"/><text x="1272.5" y="430" font-size="21" text-anchor="middle" fill="#0A2540" font-weight="600" xml:space="preserve"><tspan>replay labelled traffic</tspan></text><text x="1272.5" y="458" font-size="18" fill="#475569" font-weight="400" text-anchor="middle" ><tspan x="1272.5" dy="0">catch rate + FP rate</tspan></text><circle cx="1272.5" cy="330" r="24" fill="#0EA5A4" stroke="#FFFFFF" stroke-width="4"/><text x="1272.5" y="338" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="1272.5" dy="0">8</tspan></text><line x1="1430.0" y1="304" x2="1430.0" y2="260" stroke="#E2E8F0" stroke-width="2"/><text x="1430.0" y="218" font-size="21" text-anchor="middle" fill="#0A2540" font-weight="600" xml:space="preserve"><tspan font-family="'SFMono-Regular', Menlo, Consolas, monospace" fill="#0B7A79" font-size="20">decisions-report</tspan></text><text x="1430.0" y="246" font-size="18" fill="#475569" font-weight="400" text-anchor="middle" ><tspan x="1430.0" dy="0">the review trail</tspan></text><circle cx="1430.0" cy="330" r="24" fill="#0EA5A4" stroke="#FFFFFF" stroke-width="4"/><text x="1430.0" y="338" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="1430.0" dy="0">9</tspan></text><path d="M1035.0,544 L1035.0,560 L1510.0,560 L1510.0,544" stroke="#0A2540" stroke-width="2.5" fill="none"/><line x1="1272.5" y1="560" x2="1272.5" y2="572" stroke="#0A2540" stroke-width="2.5"/><text x="1272.5" y="604" font-size="21" fill="#0A2540" font-weight="700" text-anchor="middle" ><tspan x="1272.5" dy="0">what your fraud team sees on day one</tspan></text>
