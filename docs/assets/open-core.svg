<rect width="1600" height="820" fill="#FFFFFF"/>
<text x="800" y="72" font-size="34" fill="#0A2540" font-weight="700" text-anchor="middle" ><tspan x="800" dy="0">Open core (this repo) — Commercial modules (private)</tspan></text><rect x="70" y="120" width="540" height="70" rx="14" fill="#0EA5A4"/><rect x="95" y="152" width="22" height="18" rx="3" fill="#FFFFFF"/><path d="M99,152 V145 A7,7 0 0 1 113,143" fill="none" stroke="#FFFFFF" stroke-width="3"/><text x="132" y="164" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="start" ><tspan x="132" dy="0">OPEN — Apache-2.0, on GitHub and npm</tspan></text><rect x="990" y="120" width="540" height="70" rx="14" fill="#0A2540"/><rect x="1015" y="152" width="22" height="18" rx="3" fill="#FFFFFF"/><path d="M1019,152 V145 A7,7 0 0 1 1033,145 V152" fill="none" stroke="#FFFFFF" stroke-width="3"/><text x="1052" y="164" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="start" ><tspan x="1052" dy="0">COMMERCIAL — private implementations</tspan></text><rect x="70" y="212" width="540" height="57" rx="12" fill="#FFFFFF" stroke="#A7E3E2" stroke-width="2"/><circle cx="96" cy="240.5" r="6" fill="#0EA5A4"/><text x="118" y="247.5" font-size="20" fill="#0A2540" font-weight="500" text-anchor="start" ><tspan x="118" dy="0">Evaluation engine + verdict state machine</tspan></text><rect x="70" y="283" width="540" height="84" rx="12" fill="#FFFFFF" stroke="#A7E3E2" stroke-width="2"/><circle cx="96" cy="325.0" r="6" fill="#0EA5A4"/><text x="118" y="318.5" font-size="20" fill="#0A2540" font-weight="500" text-anchor="start" ><tspan x="118" dy="0">Velocity / mule-drain / first-payee / structuring /</tspan><tspan x="118" dy="27">dormant / odd-hours rules</tspan></text><rect x="70" y="381" width="540" height="57" rx="12" fill="#FFFFFF" stroke="#A7E3E2" stroke-width="2"/><circle cx="96" cy="409.5" r="6" fill="#0EA5A4"/><text x="118" y="416.5" font-size="20" fill="#0A2540" font-weight="500" text-anchor="start" ><tspan x="118" dy="0">DoT FRI feed adapter</tspan></text><rect x="70" y="452" width="540" height="84" rx="12" fill="#FFFFFF" stroke="#A7E3E2" stroke-width="2"/><circle cx="96" cy="494.0" r="6" fill="#0EA5A4"/><text x="118" y="487.5" font-size="20" fill="#0A2540" font-weight="500" text-anchor="start" ><tspan x="118" dy="0">HTTP gateway + Prometheus metrics +</tspan><tspan x="118" dy="27">Grafana dashboards</tspan></text><rect x="70" y="550" width="540" height="57" rx="12" fill="#FFFFFF" stroke="#A7E3E2" stroke-width="2"/><circle cx="96" cy="578.5" r="6" fill="#0EA5A4"/><text x="118" y="585.5" font-size="20" fill="#0A2540" font-weight="500" text-anchor="start" ><tspan x="118" dy="0">Decision trail + replay calibration harness</tspan></text><rect x="70" y="621" width="540" height="57" rx="12" fill="#FFFFFF" stroke="#A7E3E2" stroke-width="2"/><circle cx="96" cy="649.5" r="6" fill="#0EA5A4"/><text x="118" y="656.5" font-size="20" fill="#0A2540" font-weight="500" text-anchor="start" ><tspan x="118" dy="0">Docker / Kubernetes reference deploy</tspan></text><rect x="990" y="212" width="540" height="57" rx="12" fill="#FFFFFF" stroke="#B6C2D2" stroke-width="2"/><circle cx="1016" cy="240.5" r="6" fill="#0A2540"/><text x="1038" y="247.5" font-size="20" fill="#0A2540" font-weight="500" text-anchor="start" ><tspan x="1038" dy="0">Mule-ring graph scoring</tspan></text><rect x="990" y="283" width="540" height="57" rx="12" fill="#FFFFFF" stroke="#B6C2D2" stroke-width="2"/><circle cx="1016" cy="311.5" r="6" fill="#0A2540"/><text x="1038" y="318.5" font-size="20" fill="#0A2540" font-weight="500" text-anchor="start" ><tspan x="1038" dy="0">Automated CERT-In / FMR reporters</tspan></text><rect x="990" y="354" width="540" height="57" rx="12" fill="#FFFFFF" stroke="#B6C2D2" stroke-width="2"/><circle cx="1016" cy="382.5" r="6" fill="#0A2540"/><text x="1038" y="389.5" font-size="20" fill="#0A2540" font-weight="500" text-anchor="start" ><tspan x="1038" dy="0">Managed DIP feed ingestion</tspan></text><rect x="990" y="425" width="540" height="57" rx="12" fill="#FFFFFF" stroke="#B6C2D2" stroke-width="2"/><circle cx="1016" cy="453.5" r="6" fill="#0A2540"/><text x="1038" y="460.5" font-size="20" fill="#0A2540" font-weight="500" text-anchor="start" ><tspan x="1038" dy="0">Krediwall Verified Deployment certification</tspan></text><rect x="990" y="496" width="540" height="57" rx="12" fill="#FFFFFF" stroke="#B6C2D2" stroke-width="2"/><circle cx="1016" cy="524.5" r="6" fill="#0A2540"/><text x="1038" y="531.5" font-size="20" fill="#0A2540" font-weight="500" text-anchor="start" ><tspan x="1038" dy="0">Support, SLAs, audit guarantees</tspan></text><text x="800" y="226" font-size="19" fill="#475569" font-weight="600" text-anchor="middle" ><tspan x="800" dy="0">stable contract seams</tspan></text><line x1="610" y1="280" x2="990" y2="280" stroke="#0A2540" stroke-width="2.5" stroke-dasharray="2 0"/><circle cx="610" cy="280" r="9" fill="#0EA5A4"/><circle cx="990" cy="280" r="9" fill="#FFFFFF" stroke="#0A2540" stroke-width="3"/><rect x="640.0" y="258" width="320" height="44" rx="22" fill="#FFFFFF" stroke="#0A2540" stroke-width="2"/><text x="800" y="286" font-size="17" fill="#0A2540" font-weight="600" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace" ><tspan x="800" dy="0">GraphEvaluator interface</tspan></text><line x1="610" y1="400" x2="990" y2="400" stroke="#0A2540" stroke-width="2.5" stroke-dasharray="2 0"/><circle cx="610" cy="400" r="9" fill="#0EA5A4"/><circle cx="990" cy="400" r="9" fill="#FFFFFF" stroke="#0A2540" stroke-width="3"/><rect x="640.0" y="378" width="320" height="44" rx="22" fill="#FFFFFF" stroke="#0A2540" stroke-width="2"/><text x="800" y="406" font-size="17" fill="#0A2540" font-weight="600" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace" ><tspan x="800" dy="0">ComplianceHooks</tspan></text><line x1="610" y1="520" x2="990" y2="520" stroke="#0A2540" stroke-width="2.5" stroke-dasharray="2 0"/><circle cx="610" cy="520" r="9" fill="#0EA5A4"/><circle cx="990" cy="520" r="9" fill="#FFFFFF" stroke="#0A2540" stroke-width="3"/><rect x="640.0" y="498" width="320" height="44" rx="22" fill="#FFFFFF" stroke="#0A2540" stroke-width="2"/><text x="800" y="526" font-size="17" fill="#0A2540" font-weight="600" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace" ><tspan x="800" dy="0">BillingMeter</tspan></text><text x="800" y="772" font-size="24" fill="#0A2540" font-weight="600" text-anchor="middle" ><tspan x="800" dy="0">The seams are public and stable — the intelligence behind them is not.</tspan></text>
