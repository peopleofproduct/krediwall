<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>What happens when the feed doesn't arrive</title>
<defs>
<marker id="aN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A2540"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0EA5A4"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker>
<marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
</defs>
<rect width="1600" height="1000" fill="#FFFFFF"/>
<text x="80" y="70" font-size="36" fill="#0A2540" font-weight="700" text-anchor="start" ><tspan x="80" dy="0">What happens when the feed doesn’t arrive</tspan></text><defs><marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs><line x1="80" y1="106" x2="114" y2="106" stroke="#0EA5A4" stroke-width="4"/><text x="124" y="112" font-size="18" fill="#475569" font-weight="400" text-anchor="start" ><tspan x="124" dy="0">feed pipeline</tspan></text><line x1="310" y1="106" x2="344" y2="106" stroke="#16A34A" stroke-width="4"/><text x="354" y="112" font-size="18" fill="#475569" font-weight="400" text-anchor="start" ><tspan x="354" dy="0">healthy path</tspan></text><line x1="540" y1="106" x2="574" y2="106" stroke="#D97706" stroke-width="4"/><text x="584" y="112" font-size="18" fill="#475569" font-weight="400" text-anchor="start" ><tspan x="584" dy="0">degraded path</tspan></text><rect x="80" y="470" width="400" height="150" rx="16" fill="#FFFFFF" stroke="#0EA5A4" stroke-width="2.5"/><circle cx="116" cy="506" r="18" fill="#0EA5A4"/><text x="116" y="513" font-size="18" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="116" dy="0">1</tspan></text><text x="294.0" y="547.0" font-size="20" text-anchor="middle" font-weight="500" xml:space="preserve"><tspan fill="#0A2540" font-weight="700">DIP / DoT export</tspan></text><text x="294.0" y="575.0" font-size="18" text-anchor="middle" font-weight="500" xml:space="preserve"><tspan fill="#475569">CSV · JSON · NDJSON</tspan></text><rect x="80" y="170" width="400" height="150" rx="16" fill="#FFFFFF" stroke="#0EA5A4" stroke-width="2.5"/><circle cx="116" cy="206" r="18" fill="#0EA5A4"/><text x="116" y="213" font-size="18" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="116" dy="0">2</tspan></text><text x="294.0" y="261.0" font-size="20" text-anchor="middle" font-weight="500" xml:space="preserve"><tspan font-family="'SFMono-Regular', Menlo, Consolas, monospace" fill="#0B7A79" font-size="19" font-weight="600">translate-dip-export.mjs</tspan></text><rect x="580" y="170" width="400" height="150" rx="16" fill="#FFFFFF" stroke="#0EA5A4" stroke-width="2.5"/><circle cx="616" cy="206" r="18" fill="#0EA5A4"/><text x="616" y="213" font-size="18" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="616" dy="0">3</tspan></text><text x="794.0" y="233.0" font-size="20" text-anchor="middle" font-weight="500" xml:space="preserve"><tspan font-family="'SFMono-Regular', Menlo, Consolas, monospace" fill="#0B7A79" font-size="19" font-weight="600">fri-latest.json</tspan></text><text x="794.0" y="261.0" font-size="18" text-anchor="middle" font-weight="500" xml:space="preserve"><tspan fill="#475569">keyed-HMAC digests,</tspan></text><text x="794.0" y="289.0" font-size="18" text-anchor="middle" font-weight="500" xml:space="preserve"><tspan fill="#475569">raw identifiers never stored</tspan></text><rect x="580" y="470" width="400" height="150" rx="16" fill="#FFFFFF" stroke="#0EA5A4" stroke-width="2.5"/><circle cx="616" cy="506" r="18" fill="#0EA5A4"/><text x="616" y="513" font-size="18" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="616" dy="0">4</tspan></text><text x="794.0" y="547.0" font-size="20" text-anchor="middle" font-weight="500" xml:space="preserve"><tspan fill="#0A2540" font-weight="700">gateway auto-refresh</tspan></text><text x="794.0" y="575.0" font-size="18" text-anchor="middle" font-weight="500" xml:space="preserve"><tspan fill="#475569">every </tspan><tspan font-family="'SFMono-Regular', Menlo, Consolas, monospace" fill="#0B7A79" font-size="17" font-weight="600">KREDIWALL_FRI_REFRESH_MS</tspan></text><path d="M280,466 L280,324" stroke="#0EA5A4" stroke-width="3" fill="none" marker-end="url(#aT)"/><path d="M480,245 L576,245" stroke="#0EA5A4" stroke-width="3" fill="none" marker-end="url(#aT)"/><path d="M780,320 L780,466" stroke="#0EA5A4" stroke-width="3" fill="none" marker-end="url(#aT)"/><path d="M700,466 L700,324" stroke="#0EA5A4" stroke-width="3" fill="none" marker-end="url(#aT)"/><circle cx="530" cy="395" r="44" fill="#F0FAFA"/><text x="80" y="690" font-size="15" fill="#94A3B8" font-weight="400" text-anchor="start"><tspan x="80" dy="0">the upstream pipeline produces new exports on the lender's own schedule —</tspan><tspan x="80" dy="22">the gateway only ever re-reads the latest snapshot file</tspan><tspan x="80" dy="30">env vars and /readyz problem strings verbatim — examples/reference-gateway.mjs</tspan></text><rect x="1180" y="320" width="340" height="110" rx="16" fill="#0EA5A4"/><text x="1350" y="366" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle" ><tspan x="1350" dy="0">Krediwall engine</tspan></text><text x="1350" y="398" font-size="19" fill="#E6FFFA" font-weight="500" text-anchor="middle" ><tspan x="1350" dy="0">FRI lookups</tspan></text><path d="M980,500 L1080,500 L1080,375 L1176,375" stroke="#16A34A" stroke-width="3.5" fill="none" marker-end="url(#aG)"/><text x="1180" y="300" font-size="19" fill="#16A34A" font-weight="700" text-anchor="start" ><tspan x="1180" dy="0">refresh OK → lookups current</tspan></text><path d="M980,590 L1176,590" stroke="#D97706" stroke-width="3.5" fill="none" stroke-dasharray="8 6" marker-end="url(#aA)"/><text x="1000" y="576" font-size="18" fill="#D97706" font-weight="700" text-anchor="start" ><tspan x="1000" dy="0">refresh fails</tspan></text><rect x="1180" y="545" width="340" height="90" rx="14" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/><text x="1350" y="582" font-size="19" text-anchor="middle" font-weight="500" xml:space="preserve"><tspan fill="#0A2540">keeps serving the</tspan></text><text x="1350" y="610" font-size="19" text-anchor="middle" font-weight="500" xml:space="preserve"><tspan fill="#0A2540" font-weight="700">PREVIOUS</tspan><tspan fill="#0A2540"> snapshot</tspan></text><path d="M1350,639 L1350,676" stroke="#D97706" stroke-width="3" fill="none" marker-end="url(#aA)"/><rect x="1180" y="680" width="340" height="110" rx="14" fill="#FFFFFF" stroke="#D97706" stroke-width="2.5"/><text x="1350" y="716" font-size="19" text-anchor="middle" font-weight="500" xml:space="preserve"><tspan fill="#0A2540">snapshot older than</tspan></text><text x="1350" y="744" font-size="18" text-anchor="middle" font-weight="500" xml:space="preserve"><tspan font-family="'SFMono-Regular', Menlo, Consolas, monospace" fill="#0B7A79" font-size="17" font-weight="600">KREDIWALL_FRI_MAX_AGE_MS</tspan></text><text x="1350" y="772" font-size="18" text-anchor="middle" font-weight="500" xml:space="preserve"><tspan fill="#475569">(default 6h)</tspan></text><path d="M1180,735 L1104,735" stroke="#D97706" stroke-width="3" fill="none" marker-end="url(#aA)"/><rect x="580" y="675" width="520" height="130" rx="14" fill="#FFFFFF" stroke="#D97706" stroke-width="2.5"/><text x="604" y="708" font-size="19" text-anchor="start" font-weight="500" xml:space="preserve"><tspan font-family="'SFMono-Regular', Menlo, Consolas, monospace" fill="#0B7A79" font-size="18" font-weight="600">/readyz</tspan><tspan fill="#0A2540"> returns </tspan><tspan fill="#0A2540" font-weight="700">503</tspan><tspan fill="#0A2540"> naming the problem:</tspan></text><rect x="604" y="724" width="362.8" height="30" rx="8" fill="#FFFBEB"/><text x="619" y="745" font-size="17" fill="#92400E" font-weight="600" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" ><tspan x="619" dy="0">'fri snapshot older than maxAgeMs'</tspan></text><rect x="604" y="762" width="217.20000000000002" height="30" rx="8" fill="#FFFBEB"/><text x="619" y="783" font-size="17" fill="#92400E" font-weight="600" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" ><tspan x="619" dy="0">'fri refresh failed'</tspan></text><rect x="80" y="850" width="1440" height="76" rx="14" fill="#0A2540"/><text x="800" y="898" font-size="28" fill="#FFFFFF" font-weight="700" text-anchor="middle" ><tspan x="800" dy="0">a bad upstream feed degrades you loudly — never silently</tspan></text><text x="800" y="966" font-size="17" fill="#475569" font-weight="400" text-anchor="middle" ><tspan x="800" dy="0">health checks stay green; readiness is where feed problems surface</tspan></text>
<g transform="translate(1196,347) scale(0.055)"><title>Krediwall icon concept — Masonry</title>
  <defs>
    <!-- THEME: edit these three stops to recolour the tile -->
    <linearGradient id="kw-bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#34343E"/>
      <stop offset="0.55" stop-color="#121217"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="kw-sheen" cx="0.28" cy="0.08" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="kw-ink" cx="0.35" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#2A3358"/>
      <stop offset="0.55" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#03050C"/>
    </radialGradient>
    <linearGradient id="kw-pearl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E4FF"/>
    </linearGradient>
    <radialGradient id="kw-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#2EF2D9"/>
      <stop offset="1" stop-color="#2EF2D9" stop-opacity="0"/>
    </radialGradient>
    <filter id="kw-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0A0A2A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g id="kw-background">
    <rect width="1024" height="1024" rx="230" fill="url(#kw-bg)"/>
    <rect width="1024" height="1024" rx="230" fill="url(#kw-sheen)"/>
    <rect x="5" y="5" width="1014" height="1014" rx="225" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="10"/>
  </g>
  <g id="kw-mark" filter="url(#kw-shadow)">
    <rect id="kw-brick-1" x="262" y="282" width="220" height="120" rx="40" fill="url(#kw-pearl)"/>
    <rect id="kw-brick-2" x="502" y="282" width="260" height="120" rx="40" fill="url(#kw-pearl)"/>
    <rect id="kw-brick-3" x="262" y="452" width="340" height="120" rx="40" fill="url(#kw-pearl)"/>
    <rect id="kw-flagged-glow" x="582" y="412" width="220" height="200" rx="80" fill="url(#kw-glow)" opacity="0.8"/>
    <rect id="kw-brick-flagged" x="622" y="452" width="140" height="120" rx="40" fill="#2EF2D9"/>
    <rect id="kw-brick-5" x="262" y="622" width="120" height="120" rx="40" fill="url(#kw-pearl)"/>
    <rect id="kw-brick-6" x="402" y="622" width="360" height="120" rx="40" fill="url(#kw-pearl)"/>
  </g></g></svg>
