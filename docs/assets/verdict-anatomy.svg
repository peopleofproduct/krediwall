<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 930" width="1600" height="930" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Anatomy of a verdict</title>
<defs>
<marker id="aN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A2540"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0EA5A4"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker>
<marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
</defs>
<rect width="1600" height="930" fill="#FFFFFF"/>
<text x="800" y="66" font-size="36" fill="#0A2540" font-weight="700" text-anchor="middle" ><tspan x="800" dy="0">Anatomy of a verdict</tspan></text><rect x="330.0" y="112" width="940" height="48" rx="10" fill="#F0FAFA" stroke="#A7E3E2" stroke-width="1.5"/><text x="800.0" y="143" font-size="18" text-anchor="middle" fill="#0A2540" xml:space="preserve">every response also echoes <tspan font-family="'SFMono-Regular', Menlo, Consolas, monospace" fill="#0B7A79" font-weight="700">x-request-id</tspan> so verdicts correlate with switch logs</text><rect x="330.0" y="190" width="940" height="472" rx="16" fill="#0A2540"/><rect x="338.0" y="236" width="924" height="34" rx="6" fill="#FFFFFF" fill-opacity="0.06"/><rect x="338.0" y="308" width="924" height="34" rx="6" fill="#FFFFFF" fill-opacity="0.06"/><rect x="338.0" y="380" width="924" height="34" rx="6" fill="#FFFFFF" fill-opacity="0.06"/><rect x="338.0" y="416" width="924" height="34" rx="6" fill="#FFFFFF" fill-opacity="0.06"/><rect x="338.0" y="488" width="924" height="34" rx="6" fill="#FFFFFF" fill-opacity="0.06"/><rect x="338.0" y="524" width="924" height="34" rx="6" fill="#FFFFFF" fill-opacity="0.06"/><rect x="338.0" y="560" width="924" height="34" rx="6" fill="#FFFFFF" fill-opacity="0.06"/><text x="360.0" y="224" font-size="16" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#94A3B8">{</tspan></text><text x="360.0" y="260" font-size="16" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#94A3B8">  </tspan><tspan fill="#7FDBDA">"verdict"</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#FCA5A5">"BLOCK"</tspan><tspan fill="#94A3B8">,</tspan></text><text x="360.0" y="296" font-size="16" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#94A3B8">  </tspan><tspan fill="#7FDBDA">"hits"</tspan><tspan fill="#94A3B8">: [{</tspan></text><text x="360.0" y="332" font-size="16" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#94A3B8">    </tspan><tspan fill="#7FDBDA">"rule"</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#E2E8F0">"telemetry.mule-drain"</tspan><tspan fill="#94A3B8">,</tspan></text><text x="360.0" y="368" font-size="16" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#94A3B8">    </tspan><tspan fill="#7FDBDA">"verdict"</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#FCA5A5">"BLOCK"</tspan><tspan fill="#94A3B8">,</tspan></text><text x="360.0" y="404" font-size="16" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#94A3B8">    </tspan><tspan fill="#7FDBDA">"reason"</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#E2E8F0">"100.0% of limit burned via 2 repeat band tickets to unverified terminal"</tspan><tspan fill="#94A3B8">,</tspan></text><text x="360.0" y="440" font-size="16" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#94A3B8">    </tspan><tspan fill="#7FDBDA">"evidence"</tspan><tspan fill="#94A3B8">: { </tspan><tspan fill="#7FDBDA">"burnPct"</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#86EFAC">100.0</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#7FDBDA">"bandTickets"</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#86EFAC">2</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#7FDBDA">"windowMs"</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#86EFAC">60000</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#7FDBDA">"freshLine"</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#86EFAC">1</tspan><tspan fill="#94A3B8"> }</tspan></text><text x="360.0" y="476" font-size="16" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#94A3B8">  </tspan><tspan fill="#94A3B8">}],</tspan></text><text x="360.0" y="512" font-size="16" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#94A3B8">  </tspan><tspan fill="#7FDBDA">"ruleErrors"</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#86EFAC">[]</tspan><tspan fill="#94A3B8">,</tspan></text><text x="360.0" y="548" font-size="16" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#94A3B8">  </tspan><tspan fill="#7FDBDA">"degraded"</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#86EFAC">false</tspan><tspan fill="#94A3B8">,</tspan></text><text x="360.0" y="584" font-size="16" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#94A3B8">  </tspan><tspan fill="#7FDBDA">"elapsedMicros"</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#86EFAC">23.4</tspan></text><text x="360.0" y="620" font-size="16" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#94A3B8">}</tspan></text><rect x="30" y="176.0" width="270.0" height="156" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><circle cx="56" cy="204.0" r="14" fill="#0EA5A4"/><text x="56" y="210.0" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="56" dy="0">1</tspan></text><text x="80" y="210.0" font-size="16" fill="#0B7A79" font-weight="700" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" ><tspan x="80" dy="0">verdict</tspan></text><text x="48" y="242.0" font-size="17" fill="#0A2540" font-weight="400" text-anchor="start" ><tspan x="48" dy="0">The decision — ALLOW, REVIEW</tspan><tspan x="48" dy="23">or BLOCK. First BLOCK</tspan><tspan x="48" dy="23">short-circuits the rule</tspan><tspan x="48" dy="23">chain.</tspan></text><path d="M300.0,204.0 L318.0,204.0 L318.0,254 L334.0,254" stroke="#0EA5A4" stroke-width="1.8" fill="none"/><circle cx="330.0" cy="254" r="11" fill="#0EA5A4" stroke="#0A2540" stroke-width="2"/><text x="330.0" y="259" font-size="13" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="330.0" dy="0">1</tspan></text><rect x="1300.0" y="295.5" width="270.0" height="133" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><circle cx="1326.0" cy="323.5" r="14" fill="#0EA5A4"/><text x="1326.0" y="329.5" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="1326.0" dy="0">2</tspan></text><text x="1350.0" y="329.5" font-size="16" fill="#0B7A79" font-weight="700" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" ><tspan x="1350.0" dy="0">hits[].rule + reason</tspan></text><text x="1318.0" y="361.5" font-size="17" fill="#0A2540" font-weight="400" text-anchor="start" ><tspan x="1318.0" dy="0">Which rule fired and why —</tspan><tspan x="1318.0" dy="23">the reason is audit-ready</tspan><tspan x="1318.0" dy="23">prose.</tspan></text><path d="M1300.0,323.5 L1282.0,323.5" stroke="#0EA5A4" stroke-width="1.8" fill="none"/><path d="M1282.0,326 L1282.0,398" stroke="#0EA5A4" stroke-width="1.8"/><path d="M1282.0,326 L1266.0,326" stroke="#0EA5A4" stroke-width="1.8"/><path d="M1282.0,398 L1266.0,398" stroke="#0EA5A4" stroke-width="1.8"/><circle cx="1270.0" cy="326" r="11" fill="#0EA5A4" stroke="#0A2540" stroke-width="2"/><text x="1270.0" y="331" font-size="13" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="1270.0" dy="0">2</tspan></text><circle cx="1270.0" cy="398" r="11" fill="#0EA5A4" stroke="#0A2540" stroke-width="2"/><text x="1270.0" y="403" font-size="13" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="1270.0" dy="0">2</tspan></text><rect x="30" y="356.0" width="270.0" height="156" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><circle cx="56" cy="384.0" r="14" fill="#0EA5A4"/><text x="56" y="390.0" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="56" dy="0">3</tspan></text><text x="80" y="390.0" font-size="16" fill="#0B7A79" font-weight="700" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" ><tspan x="80" dy="0">hits[].evidence</tspan></text><text x="48" y="422.0" font-size="17" fill="#0A2540" font-weight="400" text-anchor="start" ><tspan x="48" dy="0">The numbers behind the reason</tspan><tspan x="48" dy="23">— flat, JSON-safe. This is</tspan><tspan x="48" dy="23">what an FMR filing or review</tspan><tspan x="48" dy="23">queue cites.</tspan></text><path d="M300.0,384.0 L318.0,384.0 L318.0,434 L334.0,434" stroke="#0EA5A4" stroke-width="1.8" fill="none"/><circle cx="330.0" cy="434" r="11" fill="#0EA5A4" stroke="#0A2540" stroke-width="2"/><text x="330.0" y="439" font-size="13" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="330.0" dy="0">3</tspan></text><rect x="1300.0" y="446.5" width="270.0" height="225" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><circle cx="1326.0" cy="474.5" r="14" fill="#0EA5A4"/><text x="1326.0" y="480.5" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="1326.0" dy="0">4</tspan></text><text x="1350.0" y="480.5" font-size="16" fill="#0B7A79" font-weight="700" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" ><tspan x="1350.0" dy="0">ruleErrors</tspan></text><text x="1318.0" y="512.5" font-size="17" fill="#0A2540" font-weight="400" text-anchor="start" ><tspan x="1318.0" dy="0">Rules that threw during this</tspan><tspan x="1318.0" dy="23">evaluation. Empty = every</tspan><tspan x="1318.0" dy="23">rule ran cleanly. Alert when</tspan><tspan x="1318.0" dy="23">non-empty — a broken rule</tspan><tspan x="1318.0" dy="23">never takes the pipeline down</tspan><tspan x="1318.0" dy="23">but its silence is visible</tspan><tspan x="1318.0" dy="23">here.</tspan></text><path d="M1300.0,474.5 L1282.0,474.5 L1282.0,506 L1266.0,506" stroke="#0EA5A4" stroke-width="1.8" fill="none"/><circle cx="1270.0" cy="506" r="11" fill="#0EA5A4" stroke="#0A2540" stroke-width="2"/><text x="1270.0" y="511" font-size="13" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="1270.0" dy="0">4</tspan></text><rect x="30" y="530.0" width="270.0" height="179" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><circle cx="56" cy="558.0" r="14" fill="#0EA5A4"/><text x="56" y="564.0" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="56" dy="0">5</tspan></text><text x="80" y="564.0" font-size="16" fill="#0B7A79" font-weight="700" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" ><tspan x="80" dy="0">degraded</tspan></text><text x="48" y="596.0" font-size="17" fill="#0A2540" font-weight="400" text-anchor="start" ><tspan x="48" dy="0">true means the verdict was</tspan><tspan x="48" dy="23">computed with reduced</tspan><tspan x="48" dy="23">coverage (malformed input or</tspan><tspan x="48" dy="23">a rule error). Treat as a red</tspan><tspan x="48" dy="23">flag, not a trusted verdict.</tspan></text><path d="M300.0,558.0 L318.0,558.0 L318.0,542 L334.0,542" stroke="#0EA5A4" stroke-width="1.8" fill="none"/><circle cx="330.0" cy="542" r="11" fill="#0EA5A4" stroke="#0A2540" stroke-width="2"/><text x="330.0" y="547" font-size="13" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="330.0" dy="0">5</tspan></text><rect x="1300.0" y="689.5" width="270.0" height="156" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><circle cx="1326.0" cy="717.5" r="14" fill="#0EA5A4"/><text x="1326.0" y="723.5" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="1326.0" dy="0">6</tspan></text><text x="1350.0" y="723.5" font-size="16" fill="#0B7A79" font-weight="700" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" ><tspan x="1350.0" dy="0">elapsedMicros</tspan></text><text x="1318.0" y="755.5" font-size="17" fill="#0A2540" font-weight="400" text-anchor="start" ><tspan x="1318.0" dy="0">Wall-clock microseconds</tspan><tspan x="1318.0" dy="23">inside evaluate() — 23.4</tspan><tspan x="1318.0" dy="23">here, against a 5,000µs</tspan><tspan x="1318.0" dy="23">engineering budget.</tspan></text><path d="M1300.0,717.5 L1282.0,717.5 L1282.0,578 L1266.0,578" stroke="#0EA5A4" stroke-width="1.8" fill="none"/><circle cx="1270.0" cy="578" r="11" fill="#0EA5A4" stroke="#0A2540" stroke-width="2"/><text x="1270.0" y="583" font-size="13" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="1270.0" dy="0">6</tspan></text><text x="800" y="905" font-size="17" fill="#475569" font-weight="400" text-anchor="middle" ><tspan x="800" dy="0">fields shown verbatim — see Evaluation in packages/core/src/types.ts</tspan></text>
</svg>
