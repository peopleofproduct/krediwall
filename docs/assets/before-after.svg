<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Before and after Krediwall</title>
<defs>
<marker id="aN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A2540"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0EA5A4"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker>
<marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
</defs>
<rect width="1600" height="1000" fill="#FFFFFF"/>
<text x="80" y="66" font-size="31" fill="#0A2540" font-weight="700" text-anchor="start" ><tspan x="80" dy="0">Fraud on credit-funded UPI drains lender capital — or stops before the money moves.</tspan></text><circle cx="88" cy="104" r="8" fill="#DC2626"/><text x="104" y="111" font-size="19" fill="#475569" font-weight="400" text-anchor="start" ><tspan x="104" dy="0">fraud / loss</tspan></text><circle cx="278" cy="104" r="8" fill="#0EA5A4"/><text x="294" y="111" font-size="19" fill="#475569" font-weight="400" text-anchor="start" ><tspan x="294" dy="0">Krediwall</tspan></text><circle cx="438" cy="104" r="8" fill="#16A34A"/><text x="454" y="111" font-size="19" fill="#475569" font-weight="400" text-anchor="start" ><tspan x="454" dy="0">protected</tspan></text><rect x="60" y="140" width="710" height="760" rx="18" fill="#FEF6F6" stroke="#F5C2C2" stroke-width="2"/><rect x="830" y="140" width="710" height="760" rx="18" fill="#F0FAFA" stroke="#A7E3E2" stroke-width="2"/><line x1="800" y1="160" x2="800" y2="880" stroke="#E2E8F0" stroke-width="2"/><circle cx="800" cy="520" r="22" fill="#FFFFFF" stroke="#0A2540" stroke-width="2"/><path d="M790,520 L808,520 M801,512 L809,520 L801,528" stroke="#0A2540" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="192" font-size="27" fill="#9B1C1C" font-weight="700" text-anchor="start" ><tspan x="96" dy="0">Without credit-aware screening</tspan></text><text x="866" y="192" font-size="27" fill="#0B7A79" font-weight="700" text-anchor="start" ><tspan x="866" dy="0">With Krediwall</tspan></text><circle cx="170" cy="235" r="14" fill="none" stroke="#DC2626" stroke-width="2.5"/><path d="M148,275 Q170,247 192,275" fill="none" stroke="#DC2626" stroke-width="2.5"/><text x="170" y="301" font-size="18" fill="#475569" font-weight="500" text-anchor="middle" ><tspan x="170" dy="0">mule attacker</tspan></text><path d="M210,250 L560,250" stroke="#DC2626" stroke-width="3" marker-end="url(#aN)"/><text x="385" y="238" font-size="18" fill="#9B1C1C" font-weight="500" text-anchor="middle" ><tspan x="385" dy="0">nothing checks the limit burn</tspan></text><rect x="600" y="236" width="60" height="40" rx="6" fill="none" stroke="#0A2540" stroke-width="2.5"/><line x1="600" y1="248" x2="660" y2="248" stroke="#0A2540" stroke-width="2.5"/><text x="630" y="302" font-size="18" fill="#475569" font-weight="500" text-anchor="middle" ><tspan x="630" dy="0">fresh ₹1,00,000 credit line</tspan></text><circle cx="940" cy="235" r="14" fill="none" stroke="#DC2626" stroke-width="2.5"/><path d="M918,275 Q940,247 962,275" fill="none" stroke="#DC2626" stroke-width="2.5"/><text x="940" y="301" font-size="18" fill="#475569" font-weight="500" text-anchor="middle" ><tspan x="940" dy="0">mule attacker</tspan></text><path d="M980,250 L1126,250" stroke="#DC2626" stroke-width="3"/><path transform="translate(1160,252) scale(1.0)" d="M0,-34 L28,-24 L28,2 C28,22 14,34 0,40 C-14,34 -28,22 -28,2 L-28,-24 Z" fill="#0EA5A4"/><path transform="translate(1160,252) scale(1.0)" d="M-11,2 L-3,10 L13,-8" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1160" y="316" font-size="18" fill="#0B7A79" font-weight="700" text-anchor="middle" ><tspan x="1160" dy="0">Krediwall check</tspan></text><path d="M1194,250 L1330,250" stroke="#0EA5A4" stroke-width="3" marker-end="url(#aT)"/><rect x="1370" y="236" width="60" height="40" rx="6" fill="none" stroke="#0A2540" stroke-width="2.5"/><line x1="1370" y1="248" x2="1430" y2="248" stroke="#0A2540" stroke-width="2.5"/><text x="1400" y="302" font-size="18" fill="#475569" font-weight="500" text-anchor="middle" ><tspan x="1400" dy="0">fresh ₹1,00,000 credit line</tspan></text><line x1="210" y1="360" x2="210" y2="640" stroke="#E89B9B" stroke-width="3"/><text x="184" y="367" font-size="20" fill="#475569" font-weight="700" text-anchor="end" ><tspan x="184" dy="0">T+0s</tspan></text><circle cx="210" cy="360" r="9" fill="#FFFFFF" stroke="#E89B9B" stroke-width="3"/><text x="238" y="368" font-size="22" fill="#0A2540" font-weight="400" text-anchor="start" ><tspan x="238" dy="0">New credit line approved</tspan></text><text x="184" y="447" font-size="20" fill="#475569" font-weight="700" text-anchor="end" ><tspan x="184" dy="0">T+40s</tspan></text><circle cx="210" cy="440" r="9" fill="#FFFFFF" stroke="#E89B9B" stroke-width="3"/><text x="238" y="448" font-size="22" fill="#0A2540" font-weight="400" text-anchor="start" ><tspan x="238" dy="0">₹50,000 to unverified terminal</tspan></text><text x="184" y="547" font-size="20" fill="#475569" font-weight="700" text-anchor="end" ><tspan x="184" dy="0">T+47s</tspan></text><circle cx="210" cy="540" r="9" fill="#FFFFFF" stroke="#E89B9B" stroke-width="3"/><text x="238" y="548" font-size="22" fill="#0A2540" font-weight="400" text-anchor="start" ><tspan x="238" dy="0">₹50,000 again</tspan></text><text x="184" y="647" font-size="20" fill="#475569" font-weight="700" text-anchor="end" ><tspan x="184" dy="0">T+90s</tspan></text><circle cx="210" cy="640" r="9" fill="#FFFFFF" stroke="#E89B9B" stroke-width="3"/><text x="238" y="648" font-size="22" fill="#DC2626" font-weight="700" text-anchor="start" ><tspan x="238" dy="0">Limit drained ~100%</tspan></text><circle cx="210" cy="640" r="9" fill="#DC2626"/><rect x="96" y="712" width="638" height="46" rx="23" fill="#FFFFFF" stroke="#F5C2C2" stroke-width="2"/><path d="M118,727 L134,743 M134,727 L118,743" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/><text x="152" y="742" font-size="20" fill="#0A2540" font-weight="500" text-anchor="start" ><tspan x="152" dy="0">Generic fraud stacks don’t see limit burn</tspan></text><rect x="96" y="770" width="638" height="46" rx="23" fill="#FFFFFF" stroke="#F5C2C2" stroke-width="2"/><path d="M118,785 L134,801 M134,785 L118,801" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/><text x="152" y="800" font-size="20" fill="#0A2540" font-weight="500" text-anchor="start" ><tspan x="152" dy="0">UPI is push-and-final — no recall</tspan></text><rect x="96" y="828" width="638" height="46" rx="23" fill="#FFFFFF" stroke="#F5C2C2" stroke-width="2"/><path d="M118,843 L134,859 M134,843 L118,859" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/><text x="152" y="858" font-size="20" fill="#0A2540" font-weight="500" text-anchor="start" ><tspan x="152" dy="0">Loss lands on the lender’s capital</tspan></text><line x1="980" y1="360" x2="980" y2="540" stroke="#0EA5A4" stroke-width="3"/><text x="954" y="367" font-size="20" fill="#475569" font-weight="700" text-anchor="end" ><tspan x="954" dy="0">T+0s</tspan></text><circle cx="980" cy="360" r="9" fill="#FFFFFF" stroke="#0EA5A4" stroke-width="3"/><text x="1008" y="368" font-size="22" fill="#0A2540" font-weight="400" text-anchor="start" ><tspan x="1008" dy="0">New credit line approved</tspan></text><text x="954" y="447" font-size="20" fill="#475569" font-weight="700" text-anchor="end" ><tspan x="954" dy="0">T+40s</tspan></text><circle cx="980" cy="440" r="9" fill="#FFFFFF" stroke="#0EA5A4" stroke-width="3"/><text x="1008" y="448" font-size="22" fill="#0A2540" font-weight="400" text-anchor="start" ><tspan x="1008" dy="0">₹50,000 to unverified terminal</tspan></text><text x="954" y="547" font-size="20" fill="#475569" font-weight="700" text-anchor="end" ><tspan x="954" dy="0">T+47s</tspan></text><circle cx="980" cy="540" r="9" fill="#FFFFFF" stroke="#0EA5A4" stroke-width="3"/><text x="1008" y="548" font-size="22" fill="#0A2540" font-weight="400" text-anchor="start" ><tspan x="1008" dy="0">₹50,000 again</tspan></text><rect x="1390" y="422" width="118" height="36" rx="8" fill="#FFFFFF" stroke="#0EA5A4" stroke-width="2.5"/><text x="1449.0" y="447" font-size="19" fill="#0B7A79" font-weight="800" text-anchor="middle" ><tspan x="1449.0" dy="0">REVIEW</tspan></text><text x="1008" y="474" font-size="19" fill="#475569" font-weight="400" text-anchor="start" ><tspan x="1008" dy="0">first-seen payee + 50% of limit</tspan></text><rect x="1390" y="522" width="104" height="36" rx="8" fill="#0EA5A4"/><text x="1442.0" y="547" font-size="19" fill="#FFFFFF" font-weight="800" text-anchor="middle" ><tspan x="1442.0" dy="0">BLOCK</tspan></text><rect x="1000" y="562" width="526" height="40" rx="20" fill="#FFFFFF" stroke="#0EA5A4" stroke-width="2"/><text x="1263" y="588" font-size="17" fill="#0A2540" font-weight="500" text-anchor="middle" ><tspan x="1263" dy="0">burn ratio 1.0 · 2 repeat band tickets · unverified terminal</tspan></text><text x="1008" y="628" font-size="17" fill="#94A3B8" font-weight="400" text-anchor="start" ><tspan x="1008" dy="0">evidence returned with the verdict</tspan></text><path d="M890,700 L1160,700" stroke="#DC2626" stroke-width="3" stroke-dasharray="9 7"/><path d="M1230,700 L1350,700" stroke="#DC2626" stroke-width="3" stroke-dasharray="9 7" stroke-opacity="0.35" marker-end="url(#aS)"/><line x1="1180" y1="674" x2="1180" y2="726" stroke="#16A34A" stroke-width="6" stroke-linecap="round"/><line x1="1210" y1="674" x2="1210" y2="726" stroke="#16A34A" stroke-width="6" stroke-linecap="round"/><text x="890" y="686" font-size="18" fill="#475569" font-weight="500" text-anchor="start" ><tspan x="890" dy="0">₹ to mule</tspan></text><text x="1368" y="707" font-size="18" fill="#94A3B8" font-weight="500" text-anchor="start" ><tspan x="1368" dy="0">mule account</tspan></text><rect x="890" y="760" width="590" height="84" rx="16" fill="#16A34A"/><path transform="translate(942,802) scale(0.8)" d="M0,-34 L28,-24 L28,2 C28,22 14,34 0,40 C-14,34 -28,22 -28,2 L-28,-24 Z" fill="#FFFFFF"/><path transform="translate(942,802) scale(0.8)" d="M-11,2 L-3,10 L13,-8" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path transform="translate(942,802) scale(0.8)" d="M-11,2 L-3,10 L13,-8" fill="none" stroke="#16A34A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text x="990" y="812" font-size="27" fill="#FFFFFF" font-weight="800" text-anchor="start" ><tspan x="990" dy="0">BLOCKED before money moved</tspan></text><text x="800" y="944" font-size="19" fill="#475569" font-weight="400" text-anchor="middle" ><tspan x="800" dy="0">Reported UPI fraud: over ₹1,200 crore a year, ~5× in four years; police have flagged 24+ lakh mule accounts</tspan></text><text x="800" y="972" font-size="17" fill="#94A3B8" font-weight="400" text-anchor="middle" ><tspan x="800" dy="0">(sources in the market-opportunity doc)</tspan></text>
</svg>
