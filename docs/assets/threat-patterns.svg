"826" font-size="21" fill="#0B7A79" font-weight="700" text-anchor="start" ><tspan x="608" dy="0">Days idle before reactivation</tspan></text><text x="608" y="906" font-size="17" fill="#94A3B8" font-weight="500" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" ><tspan x="608" dy="0">telemetry.dormant-reactivation</tspan></text><rect x="1080" y="550" width="460" height="380" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="1108" y="578" width="76" height="76" rx="14" fill="#F1F5F9"/><path d="M1156,590 A26,26 0 1 0 1166,636 A20,20 0 1 1 1156,590" stroke="#0A2540" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1176" cy="598" r="3" fill="#0EA5A4"/><circle cx="1184" cy="614" r="2.5" fill="#0EA5A4"/><text x="1204" y="626" font-size="26" fill="#0A2540" font-weight="700" text-anchor="start" ><tspan x="1204" dy="0">Odd-hours activity</tspan></text><text x="1108" y="700" font-size="21" fill="#0A2540" font-weight="400" text-anchor="start" ><tspan x="1108" dy="0">Overnight spending on a line</tspan><tspan x="1108" dy="28">with no night history</tspan></text><line x1="1108" y1="762" x2="1512" y2="762" stroke="#E2E8F0" stroke-width="2"/><text x="1108" y="794" font-size="18" fill="#475569" font-weight="600" text-anchor="start" ><tspan x="1108" dy="0">Caught by</tspan></text><text x="1108" y="826" font-size="21" fill="#0B7A79" font-weight="700" text-anchor="start" ><tspan x="1108" dy="0">IST hour band × per-line history</tspan></text><text x="1108" y="906" font-size="17" fill="#94A3B8" font-weight="500" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" ><tspan x="1108" dy="0">telemetry.odd-hours</tspan></text>
