pan x="108" dy="28">rolling window</tspan></text><text x="108" y="486" font-size="17" fill="#94A3B8" font-weight="500" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" ><tspan x="108" dy="0">telemetry.velocity-spike</tspan></text><rect x="580" y="130" width="460" height="380" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="608" y="158" width="76" height="76" rx="14" fill="#F1F5F9"/><rect x="622" y="170" width="34" height="50" rx="5" stroke="#0A2540" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="627" y="208" width="24" height="7" rx="2" fill="#0EA5A4"/><path d="M670,180 L670,214 M663,207 L670,214 L677,207" stroke="#0A2540" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="704" y="206" font-size="26" fill="#0A2540" font-weight="700" text-anchor="start" ><tspan x="704" dy="0">Mule drain</tspan></text><text x="608" y="280" font-size="21" fill="#0A2540" font-weight="400" text-anchor="start" ><tspan x="608" dy="0">Repeat ₹49,999 tickets to an</tspan><tspan x="608" dy="28">unverified terminal burn the limit</tspan></text><line x1="608" y1="342" x2="1012" y2="342" stroke="#E2E8F0" stroke-width="2"/><text x="608" y="374" font-size="18" fill="#475569" font-weight="600" text-anchor="start" ><tspan x="608" dy="0">Caught by</tspan></text><text x="608" y="406" font-size="21" fill="#0B7A79" font-weight="700" text-anchor="start" ><tspan x="608" dy="0">Burn ratio + band repeats +</tspan><tspan x="608" dy="28">terminal flag</tspan></text><text x="608" y="486" font-size="17" fill="#94A3B8" font-weight="500" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" ><tspan x="608" dy="0">telemetry.mule-drain</tspan></text><rect x="1080" y="130" width="460" height="380" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="1108" y="158" width="76" height="76" rx="14" fill="#F1F5F9"/><circle cx="1136" cy="184" r="10" stroke="#0