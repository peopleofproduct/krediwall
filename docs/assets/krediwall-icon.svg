<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Krediwall icon concept — Masonry</title>
  <defs>
    <!-- THEME: edit these three stops to recolour the tile -->
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#5B6BE0"/>
      <stop offset="0.55" stop-color="#24206B"/>
      <stop offset="1" stop-color="#0A0F2C"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.08" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ink" cx="0.35" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#2A3358"/>
      <stop offset="0.55" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#03050C"/>
    </radialGradient>
    <linearGradient id="pearl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E4FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#2EF2D9"/>
      <stop offset="1" stop-color="#2EF2D9" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0A0A2A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g id="background">
    <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
    <rect width="1024" height="1024" rx="230" fill="url(#sheen)"/>
    <rect x="5" y="5" width="1014" height="1014" rx="225" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="10"/>
  </g>
  <g id="mark" filter="url(#shadow)">
    <rect id="brick-1" x="262" y="282" width="220" height="120" rx="40" fill="url(#pearl)"/>
    <rect id="brick-2" x="502" y="282" width="260" height="120" rx="40" fill="url(#pearl)"/>
    <rect id="brick-3" x="262" y="452" width="340" height="120" rx="40" fill="url(#pearl)"/>
    <rect id="flagged-glow" x="582" y="412" width="220" height="200" rx="80" fill="url(#glow)" opacity="0.8"/>
    <rect id="brick-flagged" x="622" y="452" width="140" height="120" rx="40" fill="#2EF2D9"/>
    <rect id="brick-5" x="262" y="622" width="120" height="120" rx="40" fill="url(#pearl)"/>
    <rect id="brick-6" x="402" y="622" width="360" height="120" rx="40" fill="url(#pearl)"/>
  </g>
</svg>
